  # ---------------------------------------------------------------- unanswerable / premisa falsa
  - id: lotr_u01
    category: unanswerable
    question: "In the film, what does Tom Bombadil say to the hobbits when he rescues them from the Barrow-wight?"
    question_es: "En la película, ¿qué les dice Tom Bombadil a los hobbits al rescatarlos del Tumulario?"
    answer: "False premise: Tom Bombadil does not appear in the films."
    expect: abstain
    evidence: []
  - id: lotr_u02
    category: unanswerable
    question: "In the book, what does Arwen shout at the Nazgul at the Ford of Bruinen?"
    question_es: "En el libro, ¿qué le grita Arwen a los Nazgûl en el Vado del Bruinen?"
    answer: "False premise: in the book Arwen is not at the Ford; Glorfindel's horse carries Frodo."
    expect: abstain
    evidence: []
  - id: lotr_u03
    category: unanswerable
    question: "Which song does Legolas sing at Bilbo's farewell party?"
    question_es: "¿Qué canción canta Legolas en la fiesta de despedida de Bilbo?"
    answer: "False premise: Legolas is not at Bilbo's party."
    expect: abstain
    evidence: []
  - id: lotr_u04
    category: unanswerable
    question: "In the film, how does Wormtongue kill Saruman in the Shire?"
    question_es: "En la película, ¿cómo mata Gríma a Saruman en la Comarca?"
    answer: "False premise: the film (and this screenplay) never brings Saruman to the Shire; that happens only in the book."
    expect: abstain
    evidence: []

  # ---------------------------------------------------------------- premisa falsa con respuesta (aporte del autor)
  - id: lotr_p01
    category: false_premise
    question: "Why does Frodo not give in to the temptation of the Ring?"
    question_es: "¿Por qué Frodo no cae ante la tentación del anillo?"
    answer: >-
      False premise: Frodo resists for most of the journey (humility, lack of ambition, pity for Gollum and
      Sam's support), but at the Crack of Doom he does give in and claims the Ring ("I will not do this deed.
      The Ring is mine!" in the book; "The Ring is mine" in the film). It is destroyed only because Gollum
      bites it off and falls into the fire.
    must: [["gollum"], ["mine", "claim", "put it on", "puts it on", "puts on", "succumb", "gives in", "gave in",
                        "fails", "sucumbe", "cae", "se niega", "reclama", "se lo pone"]]
    evidence: [{medium: book, work: rotk, terms: ["i will not do this deed", "the ring is mine"]},
               {medium: screenplay, work: rotk, terms: ["the ring is mine"]}]

  # ---------------------------------------------------------------- interpretativas (rúbrica manual)
  - id: lotr_i01
    category: interpretive
    question: "Why is it Frodo, a hobbit, who can carry the Ring to Mordor?"
    question_es: "¿Por qué es Frodo, un hobbit, quien puede llevar el Anillo hasta Mordor?"
    answer: >-
      His humility and lack of ambition make him less vulnerable to the Ring than the powerful; his pity for
      Gollum (as Gandalf urged) and Sam's support carry him to the end. Yet at the Crack of Doom he gives in
      and claims the Ring; it is destroyed only because Gollum seizes it and falls into the fire.
    rubric: >-
      1 = da razones sustentadas en pasajes citados (humildad / falta de ambición, piedad hacia Gollum, apoyo de
      Sam) Y reconoce que al final Frodo cede; 0.5 = razones razonables pero sin evidencia citada, o sin
      reconocer que cede; 0 = inventa hechos, o afirma que Frodo nunca sucumbe.
    evidence: [{medium: book, work: fotr, terms: ["pity", "stayed his hand"]},
               {medium: book, work: rotk, terms: ["i will not do this deed", "the ring is mine"]},
               {medium: screenplay, work: rotk, terms: ["the ring is mine"]},
               {medium: screenplay, work: rotk, terms: ["carry you"]}]
