    answer: "Rubeus Hagrid."
    must: [["hagrid"]]
    evidence: [{medium: dialogue, work: hp1, terms: ["you're a wizard"]}]
  - id: hp_f02
    category: factual_film
    question: "In the Philosopher's Stone film, which professor teaches the class the Wingardium Leviosa charm?"
    question_es: "En la película La Piedra Filosofal, ¿qué profesor enseña el hechizo Wingardium Leviosa?"
    answer: "Professor Filius Flitwick."
    must: [["flitwick"]]
    evidence: [{medium: dialogue, work: hp1, terms: ["leviosa", "flitwick"]}]
  - id: hp_f03
    category: factual_film
    question: "In the Goblet of Fire film, who orders 'Kill the spare' in the graveyard?"
    question_es: "En la película El Cáliz de Fuego, ¿quién ordena 'Mata al otro' en el cementerio?"
    answer: "Voldemort (Wormtail kills Cedric)."
    must: [["voldemort"]]
    evidence: [{medium: dialogue, work: hp4, terms: ["kill the spare"]}]
  - id: hp_f04
    category: factual_film
    question: "In the Prisoner of Azkaban film, which names appear on the Marauder's Map as its makers?"
