# Benchmark Harry Potter — libros 2–7 (Pottermore 2015) vs diálogo de las 8 películas (Maven Analytics).
# El lado película es SOLO DIÁLOGO (sin acotaciones): las preguntas de película se basan en lo que
# los personajes DICEN, y las divergencias verificables son principalmente AUSENCIAS (0 menciones en
# el diálogo de las películas frente a varias en los libros), comprobadas con `rmb check-questions hp`.
# Libro 1 no está en el corpus: Philosopher's Stone solo tiene lado película.

saga: hp
questions:
  # ---------------------------------------------------------------- factual_book
  - id: hp_b01
    category: factual_book
    question: "In the Chamber of Secrets book, whose deathday party do Harry, Ron and Hermione attend, and which deathday is it?"
    question_es: "En el libro La Cámara Secreta, ¿a la fiesta de cumpleaños de muerte de quién asisten y cuál es?"
    answer: "Nearly Headless Nick's five hundredth deathday."
    must: [["nick"], ["500", "five hundredth", "five-hundredth"]]
    evidence: [{medium: book, work: hp2, terms: ["five hundredth deathday"]}]
  - id: hp_b02
    category: factual_book
    question: "In the Goblet of Fire book, what does Hermione's S.P.E.W. stand for?"
    question_es: "En el libro El Cáliz de Fuego, ¿qué significa la P.E.D.D.O. (S.P.E.W.) de Hermione?"
    answer: "Society for the Promotion of Elfish Welfare."
    must: [["promotion"], ["elfish welfare"]]
    evidence: [{medium: book, work: hp4, terms: ["elfish welfare"]}]
  - id: hp_b03
    category: factual_book
    question: "In the Goblet of Fire book, what is the name of Barty Crouch's house-elf?"
    question_es: "En el libro El Cáliz de Fuego, ¿cómo se llama la elfina doméstica de Barty Crouch?"
    answer: "Winky."
    must: [["winky"]]
    evidence: [{medium: book, work: hp4, terms: ["winky"]}]
  - id: hp_b04
    category: factual_book
    question: "In the Prisoner of Azkaban book, who sent Harry the Firebolt?"
    question_es: "En el libro El Prisionero de Azkaban, ¿quién le envió a Harry la Saeta de Fuego?"
    answer: "Sirius Black."
    must: [["sirius"]]
    evidence: [{medium: book, work: hp3, terms: ["firebolt", "sirius"]}]
  - id: hp_b05
    category: factual_book
    question: "In the Half-Blood Prince book, who replaces Cornelius Fudge as Minister for Magic?"
    question_es: "En el libro El Misterio del Príncipe, ¿quién reemplaza a Fudge como Ministro de Magia?"
    answer: "Rufus Scrimgeour."
    must: [["scrimgeour"]]
    evidence: [{medium: book, work: hp6, terms: ["scrimgeour"]}]
  - id: hp_b06
    category: factual_book
    question: "In the Half-Blood Prince book, what is the name of Merope Gaunt's father?"
    question_es: "En el libro El Misterio del Príncipe, ¿cómo se llama el padre de Merope Gaunt?"
    answer: "Marvolo Gaunt."
    must: [["marvolo"]]
    evidence: [{medium: book, work: hp6, terms: ["marvolo"]}]
  - id: hp_b07
    category: factual_book
    question: "In the Order of the Phoenix book, who does Dumbledore appoint to teach Divination after Umbridge sacks Trelawney?"
    question_es: "En el libro La Orden del Fénix, ¿a quién nombra Dumbledore para enseñar Adivinación tras el despido de Trelawney?"
    answer: "Firenze, the centaur."
    must: [["firenze"]]
    evidence: [{medium: book, work: hp5, terms: ["firenze"]}]

  # ---------------------------------------------------------------- factual_film (diálogo)
  - id: hp_f01
    category: factual_film
    question: "In the Philosopher's Stone film, who tells Harry 'You're a wizard, Harry'?"
