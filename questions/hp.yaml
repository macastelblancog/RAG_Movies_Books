    answer: "Moony, Wormtail, Padfoot and Prongs."
    must: [["moony"], ["wormtail"], ["padfoot"], ["prongs"]]
    evidence: [{medium: dialogue, work: hp3, terms: ["moony", "prongs"]}]
  - id: hp_f05
    category: factual_film
    question: "In the Half-Blood Prince film, who reveals 'I'm the Half-Blood Prince' to Harry?"
    question_es: "En la película El Misterio del Príncipe, ¿quién le revela a Harry 'Yo soy el Príncipe Mestizo'?"
    answer: "Severus Snape."
    must: [["snape"]]
    evidence: [{medium: dialogue, work: hp6, terms: ["i'm the half-blood prince"]}]

  # ---------------------------------------------------------------- divergence (ausencias verificadas)
  - id: hp_d01
    category: divergence
    question: "Does Peeves the poltergeist appear in the Harry Potter films as he does in the books?"
    question_es: "¿Aparece Peeves el poltergeist en las películas como en los libros?"
    answer: "No. Peeves is a recurring character in the books but was cut from the films."
    must: [["no", "not", "never", "cut", "absent", "omitted"]]
    evidence: [{medium: book, terms: ["peeves"]}]
  - id: hp_d02
    category: divergence
    question: "Is Hermione's S.P.E.W. campaign for house-elf rights part of the Goblet of Fire film?"
    question_es: "¿La campaña P.E.D.D.O. de Hermione forma parte de la película El Cáliz de Fuego?"
    answer: "No. It is a book-only subplot."
    must: [["no", "not", "never", "cut", "absent", "omitted", "only in the book"]]
    evidence: [{medium: book, work: hp4, terms: ["elfish welfare"]}]
  - id: hp_d03
    category: divergence
    question: "Does Nearly Headless Nick's deathday party appear in the Chamber of Secrets film?"
    question_es: "¿Aparece la fiesta de cumpleaños de muerte de Nick Casi Decapitado en la película La Cámara Secreta?"
    answer: "No. The Deathday Party chapter was cut from the film."
    must: [["no", "not", "never", "cut", "absent", "omitted"]]
    evidence: [{medium: book, work: hp2, terms: ["deathday party"]}]
  - id: hp_d04
    category: divergence
    question: "Does Winky the house-elf appear in the Goblet of Fire film as in the book?"
    question_es: "¿Aparece Winky la elfina en la película El Cáliz de Fuego como en el libro?"
    answer: "No. Winky (and the house-elf subplot) is absent from the film."
    must: [["no", "not", "never", "cut", "absent", "omitted"]]
    evidence: [{medium: book, work: hp4, terms: ["winky"]}]

  # ---------------------------------------------------------------- quantitative
  - id: hp_q01
    category: quantitative
    question: "In the Prisoner of Azkaban film dialogue, which character has the most lines?"
    question_es: "En el diálogo de la película El Prisionero de Azkaban, ¿qué personaje tiene más líneas?"
    gold_fn: top_speaker
    gold_args: {work: hp3}
    evidence: []
  - id: hp_q02
    category: quantitative
    question: "How many chapters does the Order of the Phoenix book have?"
    question_es: "¿Cuántos capítulos tiene el libro La Orden del Fénix?"
    gold_fn: n_chapters
    gold_args: {work: hp5}
    evidence: []

