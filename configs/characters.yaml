  FEYD: {names: [Feyd-Rautha, Feyd], cues: [FEYD-RAUTHA]}
  RABBAN: {names: [Rabban]}
  MOHIAM: {names: [Mohiam, Reverend Mother],
           cues: [REVEREND MOTHER, GAIUS HELEN MOHIAM, REVEREND MOTHER MOHIAM, REVEREND MOTHER GAIUS MOHIAM],
