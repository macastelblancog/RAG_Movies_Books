  BARON: {names: [Baron, Vladimir Harkonnen], cues: [BARON HARKONNEN, THE BARON]}
  CHANI: {names: [Chani]}
  STILGAR: {names: [Stilgar]}
  GURNEY: {names: [Gurney]}
  DUNCAN: {names: [Duncan, Idaho], cues: [IDAHO, DUNCAN IDAHO]}
