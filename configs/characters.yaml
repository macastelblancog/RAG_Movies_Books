# Personajes por saga — FUENTE ÚNICA para alias de hablante, conteo de menciones, grafos,
# atribución de citas del libro (intervenciones) y la comparación de personajes libro vs película.
#
#   CLAVE CANÓNICA:            nombre del personaje tal como queda como hablante en la película
#     names:   [...]           formas en que el TEXTO lo nombra (libro, acotaciones, diálogo).
#                              Se buscan con límite de palabra y respetando mayúsculas; también se
#                              acepta la forma TODO-MAYÚSCULAS (presentaciones en guion: "FRODO").
#                              Si un nombre contiene a otro ("Feyd-Rautha" / "Feyd"), se cuenta una vez.
#     cues:    [...]           variantes del hablante en el guion/CSV que se unifican en la clave.
#     nota:    "..."           advertencia de ambigüedad; acompaña los resultados.
#
# Las entradas con `nota` tienen conteos aproximados.

lotr:
  FRODO: {names: [Frodo]}
  SAM: {names: [Sam, Samwise], cues: [SAM GAMGEE, SAMWISE]}
  GANDALF: {names: [Gandalf, Mithrandir, Grey Pilgrim], cues: [GANDALF THE WHITE]}
  ARAGORN: {names: [Aragorn, Strider, Elessar], cues: [STRIDER]}
  BOROMIR: {names: [Boromir]}
  LEGOLAS: {names: [Legolas]}
  GIMLI: {names: [Gimli]}
  MERRY: {names: [Merry, Meriadoc], nota: "'Merry' también es adjetivo al inicio de frase"}
  PIPPIN: {names: [Pippin, Peregrin]}
  GOLLUM: {names: [Gollum, Sméagol, Smeagol], cues: [SMEAGOL]}
  BILBO: {names: [Bilbo]}
  THEODEN: {names: [Théoden, Theoden], cues: [KING THEODEN]}
  EOWYN: {names: [Éowyn, Eowyn]}
  EOMER: {names: [Éomer, Eomer]}
  FARAMIR: {names: [Faramir]}
  DENETHOR: {names: [Denethor]}
  SARUMAN: {names: [Saruman, Sharkey], nota: "'Sharkey' = Saruman en el Saneamiento de la Comarca"}
  GALADRIEL: {names: [Galadriel]}
  CELEBORN: {names: [Celeborn]}
  ELROND: {names: [Elrond]}
  ARWEN: {names: [Arwen]}
  HALDIR: {names: [Haldir]}
  TREEBEARD: {names: [Treebeard, Fangorn], nota: "'Fangorn' también es el bosque"}
  WORMTONGUE: {names: [Wormtongue, Gríma, Grima]}
  SAURON: {names: [Sauron]}
  BOMBADIL: {names: [Bombadil]}

