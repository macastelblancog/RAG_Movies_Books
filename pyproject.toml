[project]
name = "rag-movies-books"
version = "0.1.0b1"
description = "Libro vs guion: análisis matemático de adaptaciones (Dune, LOTR, Narnia) y RAG con citas evaluado contra LLMs generales"
authors = [{ name = "Miguel Castelblanco" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Embeddings neuronales (si no se instalan, se usa LSA = TF-IDF + SVD)
neural = ["sentence-transformers>=2.7"]
# Clientes LLM para el benchmark (si no se instalan, usar el modo 'manual')
llm = ["openai>=1.40", "google-genai>=0.3"]
dev = ["pytest>=7", "ipykernel>=6.29"]
# Orquestación del RAG como grafo (condición rag_graph, `rmb graph`)
graph = ["langgraph>=0.2"]

[project.scripts]
rmb = "rag_mb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
